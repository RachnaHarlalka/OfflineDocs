report_markdown: |
  # Adversarial review: round 1 — basis conformance + live pass

  - **Scope:** same 13-file staged diff on main; basis AC-201..AC-225; live pass on localhost:4000
  - **Confirmed:** 2 · **Likely:** 1 · **Speculative:** 0

  ## Findings

  ### H-10 — A delete-only unsaved draft is never offered back: hasContentBeyond compares state vectors, which deletions do not move  `confirmed` `sev:high` `AC-209/AC-204`
  ### H-11 — A second tab's page load silently swaps the worker under an open, dirty editor, no banner, no consent  `confirmed` `sev:high` `AC-222`
  ### H-12 — A worker already installing when the page loads never raises the update banner  `likely` `sev:medium` `AC-222`

  ## Checked and clean

  | Area | What I checked | Result |
  |---|---|---|
  | Inputs and boundaries | null/undefined/absent backup, backedUpAt, the 5MB caps | clean (AC-213 holds); 5MB band is H-4 |
  | State machine | notice appear/restore/dismiss/type-after-read, viewer, offline, remount | clean — AC-202/203/205/208/210 hold |
  | Time and ordering | heartbeat vs draft-read gate, staleTime Infinity, AC-201 once | clean except H-1's error path |
  | Concurrency | two tabs on a document; two tabs and the worker | worker case is H-11; CRDT merge fine |
  | Authorisation | draft GET role gate, canBackUp, readOnly controls, layout reorder | clean — no authz change in this diff |
  | Data integrity | Y.Doc seeding, seededSnapshot freeze, restoreDraft dirty/badge | clean (AC-206/215/217 hold); delete-set blind spot is H-10 |
  | Failure and degradation | draft GET 500/timeout, dropCachedDoc ignoreVary, registration failure | clean (AC-212 holds); swallow is H-1's mechanism |
  | Silent failure | new catches, optional chains, un-surfaced errors | H-10 and H-12 are in this class |
  | Frontend states / a11y / i18n | DraftRestoreNotice roles and names, SessionPending className, label extraction | clean — AC-214 holds exactly |

  ## Specified but not implemented

  | AC | What the basis requires | What the code does |
  |---|---|---|
  | AC-209 | no notice when the document already holds the backup's content | the inverse also fails: a deletions-only backup produces no notice (H-10) |
  | AC-222 | dirty document gets the banner, never swaps on its own | swaps when a sibling tab loads (H-11); no banner at all if the worker was installing at mount (H-12) |

  ## Could not investigate

  Live verdicts on H-2, H-5 and H-7 are all **could-not-reach**: the e2e storage states'
  JWTs have expired and reseeding was unsafe while the test wave was in flight; H-5 and
  H-11 additionally need two genuinely different sw.js builds.
