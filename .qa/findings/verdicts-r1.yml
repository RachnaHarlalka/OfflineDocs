  - observation: H-11 (hunt-r1, confirmed/high) "a sibling tab's load swaps the worker under an open dirty editor"
    id: V-4
    verdict: undecided-spec
    confidence: high
    basis: [AC-221, AC-222]
    hunter_reading: "AC-222 now supplies the oracle U-3 / PRD Q-1 was blocked on, and today's behaviour is wrong."
    adjudication: >
      PARTLY CONFIRMED, and therefore not actionable. The mechanism is real and verified:
      use-service-worker.ts:47-49 posts SKIP_WAITING for any `registration.waiting` on every
      mount with no check for other clients, and sw.js:126 `self.clients.claim()` is scoped
      to the registration, so a second tab's load does re-control a dirty tab A with no
      banner. AC-222's literal text is violated in that case.
      What I reject is the conclusion that AC-222 settles it. AC-221 mandates, just as
      explicitly, the exact load-time skip that causes the swap, and says the banner must NOT
      appear for a worker already waiting. For the multi-tab case the two ACs contradict each
      other; AC-222 cannot be the oracle for a behaviour AC-221 requires. The remedy is a
      design choice with at least three defensible answers (gate the skip on being the only
      client; banner in dirty clients; have the claimed client reload). Choosing one is the
      product decision PRD Q-1 / U-3 asks for, and it is not mine to take.
      Treated the same way AC-212 / H-1 was: recorded open, not fixed.
    question_for_human: >
      PRD Q-1 / basis U-3: when a new worker is waiting and another tab has unsaved edits,
      which wins — AC-221's silent takeover, or AC-222's consent? Answer decides whether the
      load-time SKIP_WAITING is gated on `clients.matchAll()` being a single client.
    work_order_item:
      mode: none
    blocks: [TS-18, TS-19 multi-tab variant]

  - observation: H-12 (hunt-r1, likely/medium) "a worker already installing at mount never raises the banner"
    id: V-5
    verdict: real-product-bug
    confidence: medium
    basis: [AC-222]
    root_cause: >
      watchForUpdate (use-service-worker.ts:37-64) handles only `registration.waiting`
      (auto-skip) and `updatefound` fired after the listener attaches. A worker mid-install
      when `register()` resolved has already fired updatefound, so nothing hears it reach
      `installed`; updateReady stays false and the banner never appears. Verified by reading
      the hook: there is no `registration.installing` arm.
    why_not_undecided: >
      Unlike V-4 this has no AC-221 tension. AC-221 governs a worker already WAITING at load;
      a worker still INSTALLING at load reaches installed afterwards, i.e. "an update that
      arrives while you work", which is squarely AC-222's banner case. The hook's own comment
      draws the same line. One oracle, no contradiction.
    confidence_note: "medium not high because it is static-only — no test has driven a stubbed installing worker to installed. W-6 is the gating test; the fix (W-7) must not land before it is red."
    minimal_repro: "render useServiceWorker with a stubbed registration whose `installing` is a worker in state installing and a non-null controller; drive it to installed; updateReady stays false"
    reduced_to: unit
    blast_radius:
      - apps/web/lib/pwa/use-service-worker.ts:47-62
    work_order_item:
      mode: test
      target: apps/web/lib/pwa/use-service-worker.test.ts
      what: "gating unit test for the installing-at-mount window"
    follow_on_fix: W-7

