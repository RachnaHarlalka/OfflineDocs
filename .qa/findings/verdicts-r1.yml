  - observation: TS-21 / app.test.ts:145 "a save the client's own queue-item check accepts at exactly QUEUE_ITEM_MAX_BYTES must not be permanently unsendable [AC-219][AC-225] (hunt H-4)"
    id: V-2
    verdict: real-product-bug
    confidence: high
    basis: [AC-219, AC-225]
    root_cause: >
      Two defects stacked. (a) The 500 rather than 413 is V-1's error-handler gap.
      (b) Underneath it, the real H-4 defect: save-queue.ts:265 `enqueueSave` passes
      `input.update.length` — the raw base64 string — to enqueue's
      `if (bytes > QUEUE_ITEM_MAX_BYTES)` check (save-queue.ts:295), while the server's
      `express.json({ limit: "5mb" })` counts the transmitted envelope
      `JSON.stringify({ update })`, 13 bytes larger. Both constants are 5242880; this is a
      byte-span mismatch, not drift. app.ts's own comment states the invariant this breaks:
      "A lower limit here would let the client queue a save it can never send... the worker
      would read the refusal as a transport failure and retry that document's queue forever."
    verified_independently: >
      Confirmed save-queue.ts:265 passes the raw `update.length` and :295 compares it to
      QUEUE_ITEM_MAX_BYTES; confirmed queue-schema.ts:50 and app.ts's "5mb" are both
      5242880. Envelope overhead reproduced arithmetically by the test itself.
    minimal_repro: "enqueueSave with update.length === 5242880 -> accepted by the client; the flush POSTs a 5242893-byte body -> refused by the server, forever"
    reduced_to: integration
    blast_radius:
      - apps/web/lib/offline/save-queue.ts:265
      - apps/web/lib/offline/save-queue.ts:295
      - apps/server/src/app.ts:29
      - "one stuck queue item blocks that document's whole queue: the flush treats the refusal as transport failure and retries indefinitely"
    remedy_chosen: >
      Fix on the client: measure the bytes actually transmitted, not the raw update string.
      This keeps the server cap at 5mb (so AC-218's 413 boundary is unmoved) and keeps the
      two constants equal (AC-225). The alternative — raising the server limit by the
      envelope overhead — would move AC-218's stated boundary and was rejected for that
      reason. Recorded here so the fix wave does not re-litigate it.
    work_order_item:
      mode: fix
      target: apps/web/lib/offline/save-queue.ts
      what: "size the queue item by the transmitted envelope, not the raw update string"
      fix_detail_lives_in: ".qa/findings/phase2-hardening-draft-restore-implement-w05.md — 'Fix proposed, not applied' row 1, second half (the H-4 byte-accounting gap)"
    note: >
      TS-21 as written cannot go green on either fix: it posts the exact boundary body
      itself and demands 2xx. Once the client rejects that body, the assertion's premise
      ("the client accepts this") is false. The test must be re-pinned to the invariant
      rather than the raw-length premise — work-order item W-2, mode: test. That is a test
      correction, not a loosening: the invariant asserted gets stronger, not weaker.

  - observation: H-10 (hunt-r1, confirmed/high) "delete-only unsaved draft is never offered back"
    id: V-3
    verdict: real-product-bug
    confidence: high
    basis: [AC-204, AC-209]
    root_cause: >
      `hasContentBeyond` (use-yjs-doc.ts:242-249) delegates to `hasUpdatesBeyond`
      (:71-79), which compares decoded state vectors only. A Yjs deletion creates no
      struct and advances no client clock, so a backup differing from the live document
      only by deletions scores as "nothing beyond", `restorableDraft` stays null and the
      notice never renders. AC-204 requires the notice whenever the backup holds content
      the document lacks; removed text is content the document wrongly still has.
    verified_independently: >
      Reproduced, not read. Ran yjs directly: seed "hello world", clone, delete "hello ",
      encodeStateAsUpdate as the backup -> hasUpdatesBeyond(backup, vector(current))
      returns FALSE while backup text is "world" and current is "hello world". The hunter's
      claim holds exactly as stated.
    minimal_repro: "hasContentBeyond(encodeStateAsUpdate(docWithOnlyADeletion)) === false"
    reduced_to: unit
    blast_radius:
      - apps/web/lib/documents/use-yjs-doc.ts:242-249
      - apps/web/lib/documents/use-yjs-doc.ts:71-79
      - "hasUpdatesBeyond is also the isDirty oracle at :235 — a delete-only edit may likewise read as clean; NOT yet confirmed, W-4 must check before the fix lands"
    work_order_item:
