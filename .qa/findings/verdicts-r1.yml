  - observation: TS-16b / app.test.ts:82 "refuses a body over 5MB + margin with 413 [AC-218]"
    id: V-1
    verdict: real-product-bug
    confidence: high
    basis: [AC-218]
    root_cause: >
      errorHandler (apps/server/src/middleware/error-handler.ts:17) translates only
      `error instanceof AppError`. body-parser's PayloadTooLargeError carries
      `.status = 413` / `.type = "entity.too.large"` but is not an AppError, so it falls
      to the generic branch and the client sees 500. AC-218 requires 413.
      `AppError.payloadTooLarge()` already exists (lib/http-error.ts:39) and is unused.
    verified_independently: >
      Read error-handler.ts and app.ts directly this round. The `instanceof AppError`
      gate and the unused payloadTooLarge factory are both as the w05 report states.
      Raw result confirms "expected 500 to be 413" — the cap itself fires, only the
      translation is missing. w05's diagnosis accepted on the evidence, not on its word.
    minimal_repro: "POST /docs/:id/save with a 5.5MB JSON body as an authenticated owner -> 500, expected 413"
    reduced_to: integration
    blast_radius:
      - apps/server/src/middleware/error-handler.ts:17
      - "every non-AppError thrown by middleware: body-parser malformed-JSON (400) and unsupported charset (415) are also flattened to 500"
    work_order_item:
      mode: fix
      target: apps/server/src/middleware/error-handler.ts
      what: "translate body-parser status-carrying errors to AppError before the AppError branch"
