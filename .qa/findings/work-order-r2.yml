      transmitted envelope (JSON.stringify({ update })) exactly as save-queue will after W-3,
      and assert < 300; and add the paired negative, that the first envelope size the client
      rejects is also one the server refuses with 413.
    why_not_a_loosening: "The re-pinned test asserts a strictly stronger property (client and server agree at the boundary) than the one it replaces."
