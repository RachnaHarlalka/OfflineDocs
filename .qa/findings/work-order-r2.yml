      enqueueSave (:265) passes input.update.length into enqueue's cap check (:295); it must
      pass the byte length of the envelope the flush will POST.
    fix_detail: ".qa/findings/phase2-hardening-draft-restore-implement-w05.md — 'Fix proposed, not applied', the H-4 half of row 1."
